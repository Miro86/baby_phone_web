name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install, build, and upload Astro site
        uses: withastro/action@v6
        env:
          # These defaults make the project work at the repository Pages URL.
          # Set matching repository variables when the custom domain goes live.
          SITE_URL: ${{ vars.SITE_URL || 'https://miro86.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/baby_phone_web' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
